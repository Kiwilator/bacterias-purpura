<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Museo Nascere · A-Frame</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.0/dist/aframe-extras.min.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a-scene
    renderer="colorManagement: true; physicallyCorrectLights: true; toneMapping: ACESFilmic; exposure: 1.2"
    background="color: #c6ddf1"
    fog="type: exponential; color: #c6ddf1; density: 0.09"
  >
    <a-assets timeout="15000">
      <a-asset-item id="mdl-cristales" src="./assets/cristales_bacterias_2.glb"></a-asset-item>
      <!--<a-asset-item id="mdl-techo" src="./assets/techo.glb"></a-asset-item> -->
      <a-asset-item id="planeta_museo_exterior" src="./assets/planeta_museo_central.glb"></a-asset-item>
      <a-asset-item id="mdl-techo_paredes_2" src="./assets/paredes_suelo_textura_museo.glb"></a-asset-item>
    </a-assets>

    <a-sound id="bg-sound" src="./assets/music.mp3" autoplay="false" loop="true" volume="0.4" position="0 1.6 0"></a-sound>

    <!-- Modern light rig -->
    <a-entity light="type: ambient; intensity: 0.2"></a-entity>
    <a-entity light="type: hemisphere; intensity: 0.4; color: #ffffff; groundColor: #556677"></a-entity>
    <a-entity light="type: directional; intensity: 2.2" position="2 4 3"></a-entity>

    <!-- Models -->
    <!--<a-entity gltf-model="#mdl-techo" position="-1 6 10" scale="1 1 1"></a-entity> -->
    <a-entity gltf-model="#mdl-cristales" position="0 6 10" scale="1 1 1" animation-mixer></a-entity>
<a-entity id="planet-wrapper" position="3 2 0">
  <a-entity id="planet"
            gltf-model="#planeta_museo_exterior"
            scale="1 1 1"
            show-on-near="target: #rig; distance: 4"
            animation__rotation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear"
            animation__float="property: position; dir: alternate; dur: 4000; easing: easeInOutSine; loop: true; to: 0 0.3 0">
  </a-entity>
</a-entity>
    <a-entity gltf-model="#mdl-techo_paredes_2" position="0 6 10" scale="1 1 1" animation-mixer></a-entity>

    <!-- Camera + controls -->
    <a-entity id="rig" position="0 1.6 4">
      <a-entity camera look-controls wasd-controls cursor="rayOrigin: mouse"></a-entity>
    </a-entity>

    <a-entity id="debug" position="0 2 -2" text="value: ; align: center"></a-entity>
  </a-scene>

  <script>
  // Function to play the sound
 function playSound() {
    // Get the a-sound element by its ID
    const sound = document.querySelector("#bg-sound");

    // Check if the sound component is found and play it
    if (sound) {
      sound.components.sound.playSound();
    }
  }

  // Add a click event listener to the document
  document.addEventListener("click", function () {
    playSound();
  });

AFRAME.registerComponent("show-on-near", {
  schema: {
    // Optional: if you pass a target, we’ll measure to that; otherwise we use the active camera.
    target: { type: "selector", default: null },
    distance: { type: "number", default: 4 }
  },
  init: function () {
    this.isVisible = false;
    this.materials = [];
    this.THREE = AFRAME.THREE; // safer than relying on global THREE

    // When the model loads, collect ALL materials (including arrays) and set opacity to 0
    this.el.addEventListener("model-loaded", () => {
      this.materials.length = 0;
      this.el.object3D.traverse((node) => {
        if (!node.isMesh || !node.material) return;

        const pushMat = (m) => {
          // Ensure we can actually fade it
          m.transparent = true;
          // Helps avoid z-sorting artifacts in some cases while fading
          m.depthWrite = false;
          m.opacity = 0;
          m.needsUpdate = true;
          this.materials.push(m);
        };

        if (Array.isArray(node.material)) {
          node.material.forEach(pushMat);
        } else {
          pushMat(node.material);
        }
      });
    });
  },
  tick: function () {
    if (this.materials.length === 0) return;

    const camPos = new this.THREE.Vector3();
    const objPos = new this.THREE.Vector3();

    // Use target if provided; otherwise use active camera
    if (this.data.target) {
      this.data.target.object3D.getWorldPosition(camPos);
    } else if (this.el.sceneEl && this.el.sceneEl.camera) {
      this.el.sceneEl.camera.getWorldPosition(camPos);
    } else {
      return; // no camera yet
    }
    this.el.object3D.getWorldPosition(objPos);

    const dist = camPos.distanceTo(objPos);
    if (dist < this.data.distance && !this.isVisible) {
      this.fadeTo(1);
      this.isVisible = true;
    } else if (dist >= this.data.distance && this.isVisible) {
      this.fadeTo(0);
      this.isVisible = false;
    }
  },
  fadeTo: function (targetOpacity) {
    const duration = 1000;
    const startTime = performance.now();

    // If we’re fading back in, re-enable the write just at the end for correctness
    const animate = (time) => {
      const t = Math.min((time - startTime) / duration, 1);
      for (const mat of this.materials) {
        const start = mat.opacity;
        mat.opacity = start + (targetOpacity - start) * t;
        mat.needsUpdate = true;
      }
      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        const finishingToOne = targetOpacity >= 1;
        for (const mat of this.materials) {
          mat.depthWrite = finishingToOne; // restore when fully opaque
          mat.needsUpdate = true;
        }
      }
    };
    requestAnimationFrame(animate);
  }
});
  </script>
</body>
</html>
